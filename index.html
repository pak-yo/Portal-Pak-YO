<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9">
  <meta name="description" content="Portal Pak Yo - SMP Negeri 8 Kota Pontianak">

  <title>Portal | Pak Yo</title>
  <link rel="icon" type="image/png" href="https://github.com/pak-yo.png">

  <!-- Percepat koneksi ke server Google -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f6f9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    /* Bingkai utama: memenuhi layar penuh di laptop, HP, dan tablet.
       100dvh = tinggi layar yang sebenarnya (tidak terpotong bar browser HP) */
    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;      /* cadangan untuk browser lama */
      height: 100dvh;
      border: 0;
      display: block;
      background: #f4f6f9;
    }

    /* Layar pemuatan */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: #f4f6f9;
      color: #334155;
      transition: opacity .3s ease, visibility .3s ease;
    }
    #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #d5dbe5;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-title { font-size: 1.05rem; font-weight: 600; }
    .loader-sub   { font-size: .85rem; color: #64748b; }

    /* Muncul jika pemuatan lambat */
    #slow {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: .85rem;
      color: #475569;
    }
    #slow.show { display: flex; }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: .9rem;
      text-decoration: none;
    }
    .btn:active { transform: scale(.97); }

    @media (prefers-color-scheme: dark) {
      html, body, .app-frame, #loader { background: #0f172a; }
      #loader { color: #e2e8f0; }
      .loader-sub, #slow { color: #94a3b8; }
      .spinner { border-color: #334155; border-top-color: #60a5fa; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="spinner"></div>
    <div>
      <div class="loader-title">Memuat Portal Pak Yo…</div>
      <div class="loader-sub">Mohon tunggu sebentar</div>
    </div>
    <div id="slow">
      <span>Pemuatan terasa lama? Coba buka langsung:</span>
      <a class="btn" id="openDirect" target="_blank" rel="noopener">Buka di Tab Baru</a>
    </div>
  </div>

  <iframe
    id="app"
    class="app-frame"
    title="Portal Pak Yo"
    src="https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbwP0HVrLWgpTH-ZeVz_p9xIk3bj5W5Liw__IVuSmKh05h2lS-Z-dsYMUg1QplahqJDoJA/exec"
    allow="fullscreen; clipboard-write; camera; microphone; geolocation"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <noscript>
    <p style="padding:24px;text-align:center">
      Aktifkan JavaScript, atau
      <a href="https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbwP0HVrLWgpTH-ZeVz_p9xIk3bj5W5Liw__IVuSmKh05h2lS-Z-dsYMUg1QplahqJDoJA/exec">buka portal langsung</a>.
    </p>
  </noscript>

  <script>
    (function () {
      var frame  = document.getElementById('app');
      var loader = document.getElementById('loader');
      var slow   = document.getElementById('slow');
      var direct = document.getElementById('openDirect');

      direct.href = frame.src;

      // Sembunyikan layar pemuatan setelah aplikasi selesai dimuat
      frame.addEventListener('load', function () {
        loader.classList.add('hide');
        clearTimeout(timer);
      });

      // Jika lebih dari 8 detik, tampilkan tombol cadangan
      var timer = setTimeout(function () {
        slow.classList.add('show');
      }, 8000);

      // Pastikan tinggi selalu pas saat layar diputar / ukuran berubah
      function fit() {
        var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
        frame.style.height = h + 'px';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
      fit();
    })();
  </script>

</body>
</html>
